name: Deploy PickVia site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - Localization/website/**
      - Localization/locales.json
      - scripts/localize-website.py
      - scripts/test_localize_website.py
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate generated translations
        run: |
          python3 scripts/localize-website.py --check
          python3 scripts/test_localize_website.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
